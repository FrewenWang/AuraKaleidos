#!/bin/bash
# ============================================================
# 🔧 工具包版本映射配置文件
# ============================================================

# ========================
# 🎨 颜色定义（可复用于其他脚本）
# ========================
if [ -t 1 ]; then
  C_RESET='\033[0m'
  C_BOLD='\033[1m'
  C_DIM='\033[2m'
  C_RED='\033[31m'
  C_GREEN='\033[32m'
  C_YELLOW='\033[33m'
  C_BLUE='\033[34m'
  C_CYAN='\033[36m'
  C_GRAY='\033[90m'
else
  C_RESET='' C_BOLD='' C_DIM='' C_RED='' C_GREEN='' C_YELLOW='' C_BLUE='' C_CYAN='' C_GRAY=''
fi

# 快捷打印函数（可复用于其他脚本）
info() { echo -e "${C_BLUE}ℹ️  $*${C_RESET}"; }
success() { echo -e "${C_GREEN}✅ $*${C_RESET}"; }
warn() { echo -e "${C_YELLOW}⚠️  $*${C_RESET}"; }
error() { echo -e "${C_RED}❌ $*${C_RESET}"; }
header() { echo -e "\n${C_BOLD}${C_CYAN}$*${C_RESET}"; }

# ========================
# 📂 工具包路径配置
# ========================
NDK_BASE_PATH="$HOME/Library/AAuraLib/ndk"
NDK_LINK_PATH="$NDK_BASE_PATH/ndk-home"

OPENCV_BASE_PATH="$HOME/01.WorkSpace/AuraKaleidos/FantasyCXX/3rdparty/opencv/lib"
OPENCV_LINK_PATH="$HOME/Library/AAuraLib/opencv/opencv-home"

# ========================
# 🔀 NDK 版本映射（友好名称 → 版本号）
# ========================
declare -A NDK_VERSION_MAP=(
  ["r25"]="25.2.9519653"
  ["r25c"]="25.2.9519653"
  ["r26"]="26.3.11579264"
  ["r26d"]="26.3.11579264"
  ["r27"]="27.0.12077973"
  ["r27c"]="27.0.12077973"
  ["r27d"]="27.3.13750724"
)

# NDK 反向映射（版本号 → 友好名称）
declare -A NDK_FRIENDLY_MAP=(
  ["25.2.9519653"]="r25c"
  ["26.3.11579264"]="r26d"
  ["27.0.12077973"]="r27/r27c"
  ["27.3.13750724"]="r27d"
)

# NDK 版本描述（友好名称 → 说明）
declare -A NDK_VERSION_DESC=(
  ["r25"]="Android NDK r25c (LTS)"
  ["r25c"]="Android NDK r25c (LTS)"
  ["r26"]="Android NDK r26d"
  ["r26d"]="Android NDK r26d"
  ["r27"]="Android NDK r27"
  ["r27c"]="Android NDK r27c"
  ["r27d"]="Android NDK r27d (Latest)"
)

# ========================
# 🔀 OpenCV 版本映射
# ========================
declare -A OPENCV_VERSION_MAP=(
  ["4.6"]="v4.9.0"
  ["4.8"]="v4.8.0"
  ["4.11"]="v4.11.0"
)

declare -A OPENCV_FRIENDLY_MAP=(
  ["v4.8.0"]="4.8"
  ["v4.9.0"]="4.6"
  ["v4.11.0"]="4.11"
)

# ========================
# 📖 兼容旧版函数接口（脚本中可能引用）
# ========================
get_ndk_version() {
  local result="${NDK_VERSION_MAP[$1]}"
  echo "${result:-$1}" # 找不到则原样返回
}

get_opencv_version() {
  local result="${OPENCV_VERSION_MAP[$1]}"
  echo "${result:-$1}"
}

get_ndk_friendly_name() {
  local result="${NDK_FRIENDLY_MAP[$1]}"
  echo "${result:-}"
}

get_opencv_friendly_name() {
  local result="${OPENCV_FRIENDLY_MAP[$1]}"
  echo "${result:-}"
}
