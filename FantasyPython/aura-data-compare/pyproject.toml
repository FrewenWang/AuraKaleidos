[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-data-compare"
version = "0.1.0"
description = "Numeric array comparison and visualization helpers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["data_comparator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
