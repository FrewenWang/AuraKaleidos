[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-algorithms"
version = "0.1.0"
description = "Small, tested Python implementations of interview algorithms."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["L27_remove_element", "L43_multiply_strings_TODO", "L80_remove_duplicates_from_sorted_array_ii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
