/**
 * 下面这些都是闭包调用。
 * 设置构建的脚本的版本信息等
 */
buildscript {
    ext.kotlin_version = '1.3.72'//kotlin的版本
    ext.anko_version = '0.10.8'
    repositories {
        google()
        //解决Gradle从JCenter下载慢的问题 将JCenter()替换为阿里的镜像库
        maven { url 'http://maven.aliyun.com/nexus/content/groups/public/' }
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.0.0'
        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.7.3'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.5'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

/**
 * 使用闭包设置所有的工程的依赖。
 *
 * 这个只是一个方法。接受一个闭包作为参数。对工程进行遍历。遍历的过程中使用我们自定义的闭包。
 * 所以我们可以在比暴力进行配置、打印、输出或者修改Project的属性都可以。
 */
allprojects {
    repositories {
        google()
        //解决Gradle从将JCenter下载慢的问题 将将JCenter替换为阿里的镜像库
        maven { url 'http://maven.aliyun.com/nexus/content/groups/public/' }
        jcenter()
        maven { url 'https://dl.bintray.com/frewenwong/androidmaven' }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

//添加工程根目录下的'dependencies.gradle'文件依赖
apply from: 'https://gitee.com/frewen1225/gradle_dependence/raw/master/app_dependence.gradle'

// 往.git目录下注入 pre-commit 文件
apply from: 'hooks/install-git-hooks.gradle'

apply from: 'quality/quality.gradle'
