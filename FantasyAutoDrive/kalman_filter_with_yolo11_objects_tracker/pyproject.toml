[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-yolo-object-tracker"
version = "0.1.0"
description = "YOLO detection and Kalman-filter object tracking demo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<5", "scipy>=1.10,<2", "ultralytics>=8.3,<9"]

[project.scripts]
alice-object-tracker = "app.cli:run_tracking"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["assets/*.txt"]
